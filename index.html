<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deepfake Detectors, Shape by Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070c; --panel: #111826; --line: #263246; --text: #e9eef6; --dim: #8d9bb0; --accent: #39d0d8;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  body.render { overflow: hidden; }
  body.render #ui, body.render #cap { display: none !important; }
  body.render #stage { width: 1920px; height: 1080px; }
  #wrap { max-width: 1600px; margin: 0 auto; padding: 16px; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #070a10; border-radius: 10px; overflow: hidden; }
  body.render #stage { border-radius: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #cap { margin-top: 10px; min-height: 3.2em; padding: .5em .9em; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); font-size: clamp(14px, 1.3vw, 19px); line-height: 1.45; text-align: center; }
  #cap:empty::before { content: '\00a0'; }
  #ui { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  #bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font: 600 14px Inter, sans-serif; cursor: pointer; min-height: 38px; }
  button:hover, select:hover { border-color: var(--accent); }
  #time { font: 500 14px 'JetBrains Mono', monospace; color: var(--dim); min-width: 120px; }
  #seek { position: relative; height: 26px; cursor: pointer; }
  #seek .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--line); border-radius: 2px; }
  #seek .fill { position: absolute; left: 0; top: 11px; height: 4px; background: var(--accent); border-radius: 2px; }
  #seek .tick { position: absolute; top: 7px; width: 2px; height: 12px; background: #3b4a63; }
  #chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  #chapters button { text-align: left; font-weight: 500; }
  #tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  #tabs button.on { background: var(--accent); color: #05070c; border-color: var(--accent); }
  #chapters button.on { border-color: var(--accent); color: var(--accent); }
  .grow { flex: 1; }
  .hint { color: var(--dim); font-size: 13px; }
  @media (max-width: 600px) { #wrap { padding: 8px; } #chapters { grid-template-columns: 1fr 1fr; } }
</style>
<div id="wrap">
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="cap" aria-live="polite"></div>
  <div id="ui">
    <div id="tabs"></div>
    <div id="seek"><div class="track"></div><div class="fill" id="fill"></div></div>
    <div id="bar">
      <button id="play">▶ Play</button>
      <button id="back">⟲ 10s</button>
      <button id="fwd">10s ⟳</button>
      <span id="time">0:00 / 0:00</span>
      <span class="grow"></span>
      <button id="ccbtn">CC on</button>
      <select id="rate"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
    </div>
    <div class="hint">Space = play/pause · ←/→ = 5 s · click a chapter to jump · pause anywhere to study a frame.</div>
    <div id="chapters"></div>
  </div>
</div>
<audio id="aud" preload="auto"></audio>
<script>
const VIDEOS = [
  { id: 'w2v2', name: 'wav2vec 2.0', files: ['scenes1.js', 'scenes2.js', 'scenes3.js'] },
  { id: 'aasist', name: 'AASIST back-end', files: ['scenes.js'] },
  { id: 'mambo', name: 'XLSR-MamBo back-end', files: ['scenes.js'] },
];
function loadScript(src) {
  return new Promise(res => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = res; document.head.appendChild(el); });
}
(async function () {
  const params = new URLSearchParams(location.search);
  const hashId = (location.hash || '').slice(1);
  const vid = VIDEOS.find(v => v.id === (params.get('v') || hashId)) || VIDEOS[0];
  await loadScript('videos/' + vid.id + '/config.js');
  await loadScript('src/engine.js');
  for (const f of vid.files) await loadScript('videos/' + vid.id + '/' + f);
  await loadScript('build/' + vid.id + '/timeline.js');
  const RENDER = params.has('render');
  if (RENDER) document.body.classList.add('render');
  try {
    await Promise.all(['400 30px Inter', '500 30px Inter', '600 30px Inter', '700 30px Inter', '800 30px Inter',
      '400 30px "JetBrains Mono"', '600 30px "JetBrains Mono"', '700 30px "JetBrains Mono"'].map(f => document.fonts.load(f)));
  } catch (e) {}
  const canvas = document.getElementById('c');
  const TL = E.init(canvas);
  window.TOTAL = TL.total;
  window.renderFrame = (t, q) => { E.renderAt(t); return canvas.toDataURL('image/jpeg', q || 0.93); };
  window.drawAt = t => { E.renderAt(t); return true; };
  window.READY = true;
  if (RENDER) { E.renderAt(+params.get('t') || 0); return; }

  const aud = document.getElementById('aud');
  let hasAudio = false, clock = 0, playing = false, last = performance.now();
  aud.addEventListener('canplay', () => { hasAudio = true; aud.currentTime = clock; aud.playbackRate = +document.getElementById('rate').value; if (playing) aud.play().catch(() => {}); }, { once: true });
  // load as a blob so seeking works even on servers without HTTP range support
  const mp3 = 'build/' + vid.id + '/narration.mp3';
  if (location.protocol === 'file:') aud.src = mp3;
  else fetch(mp3).then(r => r.ok ? r.blob() : Promise.reject()).then(b => { aud.src = URL.createObjectURL(b); }).catch(() => { aud.src = mp3; });
  let cc = true;
  try { cc = localStorage.getItem('w2v-cc') !== '0'; } catch (e) {}
  const $ = id => document.getElementById(id);
  const capEl = $('cap'), fill = $('fill'), timeEl = $('time');
  const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const now = () => hasAudio ? aud.currentTime : clock;
  function seek(t) { t = Math.max(0, Math.min(TL.total - 0.01, t)); clock = t; if (hasAudio) aud.currentTime = t; draw(); }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ Pause' : '▶ Play';
    if (hasAudio) { if (p) aud.play().catch(() => {}); else aud.pause(); }
    last = performance.now();
  }
  const tabs = $('tabs');
  VIDEOS.forEach(v => {
    const b = document.createElement('button');
    b.textContent = v.name; b.className = v.id === vid.id ? 'on' : '';
    b.onclick = () => { if (v.id === vid.id) return; if (params.has('v')) location.search = '?v=' + v.id; else { location.hash = v.id; location.reload(); } };
    tabs.appendChild(b);
  });
  const chWrap = $('chapters'), chBtns = [];
  TL.scenes.forEach(sc => {
    const b = document.createElement('button');
    b.textContent = String(sc.scene.chapter).padStart(2, '0') + ' · ' + sc.scene.title;
    b.onclick = () => seek(sc.start + 0.01);
    chWrap.appendChild(b); chBtns.push(b);
    const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (sc.start / TL.total * 100) + '%';
    $('seek').appendChild(tk);
  });
  function draw() {
    const t = now();
    const r = E.renderAt(t);
    fill.style.width = (t / TL.total * 100) + '%';
    timeEl.textContent = mmss(t) + ' / ' + mmss(TL.total);
    capEl.hidden = !cc;
    capEl.textContent = cc ? E.captionAt(t) : '';
    chBtns.forEach((b, i) => b.classList.toggle('on', i === r.scene));
  }
  function loop(ts) {
    const dt = (ts - last) / 1000; last = ts;
    if (playing && !hasAudio) clock += dt * (+$('rate').value);
    if (playing && now() >= TL.total - 0.02) setPlaying(false);
    draw();
    requestAnimationFrame(loop);
  }
  $('play').onclick = () => setPlaying(!playing);
  $('back').onclick = () => seek(now() - 10);
  $('fwd').onclick = () => seek(now() + 10);
  $('rate').onchange = e => { aud.playbackRate = +e.target.value; };
  $('ccbtn').textContent = cc ? 'CC on' : 'CC off';
  $('ccbtn').onclick = () => { cc = !cc; $('ccbtn').textContent = cc ? 'CC on' : 'CC off'; try { localStorage.setItem('w2v-cc', cc ? '1' : '0'); } catch (e) {} };
  const seekEl = $('seek');
  function seekFromEvent(e) { const r = seekEl.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TL.total); }
  let dragging = false;
  seekEl.addEventListener('pointerdown', e => { dragging = true; seekFromEvent(e); seekEl.setPointerCapture(e.pointerId); });
  seekEl.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
  seekEl.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('click', () => setPlaying(!playing));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowLeft') seek(now() - 5);
    if (e.code === 'ArrowRight') seek(now() + 5);
  });
  window.seekTo = seek;
  window.sceneStart = id => { const sc = TL.scenes.find(s => s.scene.id === id); return sc ? sc.start : 0; };
  window.beatTime = (id, b, dt) => { const sc = TL.scenes.find(s => s.scene.id === id); seek(sc.start + sc.beats[b].start + (dt || 0)); return sc.start + sc.beats[b].start + (dt || 0); };
  const start = parseFloat(params.get('t'));
  if (start) seek(start);
  requestAnimationFrame(loop);
})();
</script>

</body></html>
